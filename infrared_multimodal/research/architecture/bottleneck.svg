<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="690" viewBox="0 0 1500 690" role="img" aria-label="03 / ResNet Bottleneck：每个卷积与捷径">
        <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#60758a"/></marker></defs>
        <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#18344b}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#52697b}.label{font-size:18px;font-weight:700}.line{font-size:15px}.src{font-size:13px;fill:#52697b}.wire{fill:none;stroke:#60758a;stroke-width:2;marker-end:url(#arr)}</style>
        <rect width="1500" height="690" fill="#f7fafc"/>
        <text x="42" y="50" class="title">03 / ResNet Bottleneck：每个卷积与捷径</text><text x="42" y="80" class="sub">16 个块均遵循此结构；下方网页逐块列出输入通道、stride、输出尺寸与 Non-local 插入位置。</text>
<g data-box="42,155,215,115">
<rect x="42" y="155" width="215" height="115" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="42" y="167" width="5" height="91" rx="2" fill="#215da8"/>
<text x="58" y="184" class="label">输入 X</text>
<text x="58" y="209" class="line">C_in × H × W</text>
<text x="58" y="257" class="src">ResNet-50 [S1]</text>
</g>
<g data-box="310,155,265,115">
<rect x="310" y="155" width="265" height="115" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="310" y="167" width="5" height="91" rx="2" fill="#215da8"/>
<text x="326" y="184" class="label">Conv 1×1 → BN → ReLU</text>
<text x="326" y="209" class="line">C_in → C_mid</text>
<text x="326" y="233" class="line">stride=1，padding=0</text>
<text x="326" y="257" class="src">降维；bias=False</text>
</g>
<g data-box="625,155,265,115">
<rect x="625" y="155" width="265" height="115" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="625" y="167" width="5" height="91" rx="2" fill="#215da8"/>
<text x="641" y="184" class="label">Conv 3×3 → BN → ReLU</text>
<text x="641" y="209" class="line">C_mid → C_mid</text>
<text x="641" y="233" class="line">stride=s，padding=1</text>
<text x="641" y="257" class="src">提取空间特征；bias=False</text>
</g>
<g data-box="940,155,265,115">
<rect x="940" y="155" width="265" height="115" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="940" y="167" width="5" height="91" rx="2" fill="#215da8"/>
<text x="956" y="184" class="label">Conv 1×1 → BN</text>
<text x="956" y="209" class="line">C_mid → 4 C_mid</text>
<text x="956" y="233" class="line">stride=1，padding=0</text>
<text x="956" y="257" class="src">升维；这里不先做 ReLU</text>
</g>
<g data-box="1260,155,198,115">
<rect x="1260" y="155" width="198" height="115" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="1260" y="167" width="5" height="91" rx="2" fill="#215da8"/>
<text x="1276" y="184" class="label">Add → ReLU</text>
<text x="1276" y="209" class="line">与捷径逐元素相加</text>
<text x="1276" y="233" class="line">输出 C_out</text>
<text x="1276" y="257" class="src">C_out=4 C_mid</text>
</g>
<polyline points="257,210 310,210" class="wire"/>
<polyline points="575,210 625,210" class="wire"/>
<polyline points="890,210 940,210" class="wire"/>
<polyline points="1205,210 1260,210" class="wire"/>
<g data-box="460,340,650,123">
<rect x="460" y="340" width="650" height="123" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="460" y="352" width="5" height="99" rx="2" fill="#215da8"/>
<text x="476" y="369" class="label">捷径分支</text>
<text x="476" y="394" class="line">每个 stage 的 B1：Conv 1×1, C_in→C_out, stride=s → BN</text>
<text x="476" y="418" class="line">其余块：Identity；输出与主分支形状相同</text>
<text x="476" y="450" class="src">投影也使用 bias=False；即使 s=1，通道改变仍需投影</text>
</g>
<polyline points="150,270 150,400 460,400" class="wire"/>
<polyline points="1110,400 1355,400 1355,270" class="wire"/>
<g data-box="42,510,1416,116">
<rect x="42" y="510" width="1416" height="116" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="42" y="522" width="5" height="92" rx="2" fill="#215da8"/>
<text x="58" y="539" class="label">本项目实际 stride / 通道配置</text>
<text x="58" y="564" class="line">Stage1: C_mid=64, 3 blocks, s=1；Stage2: C_mid=128, 4 blocks, 首块 s=2；Stage3: C_mid=256, 6 blocks, 首块 s=2</text>
<text x="58" y="588" class="line">Stage4: C_mid=512, 3 blocks, 首块 s=1。没有上采样、解码器或转置卷积；最大空间下采样倍数为 16。</text>
<text x="58" y="613" class="src">详细模块名对应 stages.0–3；stages.s.b 内含 conv1/bn1/conv2/bn2/conv3/bn3/relu/downsample</text>
</g><text x="42" y="670" class="src">实现依据：code/model.py · code/objectives.py · 实测尺寸见 layer_trace.json ｜ 2026-11-13</text></svg>