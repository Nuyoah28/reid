<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 410" role="img" aria-label="第二阶段单图推理拓扑"><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#18243a}.t{font-size:17px;font-weight:700}.s{font-size:13px}.box{fill:#e7f0ff;stroke:#3774bb;stroke-width:1.5}.new{fill:#fff1d4;stroke:#bf8319;stroke-width:1.5}.std{fill:#e5f5ed;stroke:#5c9a75;stroke-width:1.5}.candidate{fill:#eee6ff;stroke:#7953ab;stroke-width:1.5}.arrow{stroke:#526985;stroke-width:2;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:6 4}</style><rect width="1300" height="100%" fill="white"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#526985"/></marker></defs><g><rect x="25" y="55" width="140" height="100" rx="9" class="std"/><text x="95.0" y="83" text-anchor="middle" class="t">单张 RGB</text><text x="95.0" y="108" text-anchor="middle" class="s">3×256×128</text><text x="95.0" y="131" text-anchor="middle" class="s">Resize / Normalize</text></g><g><rect x="200" y="55" width="195" height="100" rx="9" class="box"/><text x="297.5" y="83" text-anchor="middle" class="t">OSNet x1.0</text><text x="297.5" y="108" text-anchor="middle" class="s">6 个 OSBlock</text><text x="297.5" y="131" text-anchor="middle" class="s">ICCV 2019 · 原样引用</text></g><g><rect x="430" y="55" width="160" height="100" rx="9" class="box"/><text x="510.0" y="83" text-anchor="middle" class="t">空间特征 F</text><text x="510.0" y="108" text-anchor="middle" class="s">512×16×8</text><text x="510.0" y="131" text-anchor="middle" class="s">共 128 个位置</text></g><g id="pool"><rect x="805" y="55" width="210" height="100" rx="9" class="new"/><text x="910.0" y="83" text-anchor="middle" class="t">加权空间池化</text><text x="910.0" y="108" text-anchor="middle" class="s">Σ(W·F) / ΣW</text><text x="910.0" y="131" text-anchor="middle" class="s">无头变体使用 GAP</text></g><g><rect x="1050" y="55" width="225" height="100" rx="9" class="box"/><text x="1162.5" y="83" text-anchor="middle" class="t">FC → L2 normalize</text><text x="1162.5" y="108" text-anchor="middle" class="s">512→512 / BN / ReLU</text><text x="1162.5" y="131" text-anchor="middle" class="s">独立的 512 维检索向量</text></g><g id="reliability"><rect x="430" y="215" width="335" height="123" rx="9" class="new"/><text x="597.5" y="243" text-anchor="middle" class="t">沿用 v1 可靠性头</text><text x="597.5" y="268" text-anchor="middle" class="s">F.detach → 1×1 Conv 512→32</text><text x="597.5" y="291" text-anchor="middle" class="s">GN4 / SiLU → DW3×3 / SiLU</text><text x="597.5" y="314" text-anchor="middle" class="s">1×1 Conv 32→1 → sigmoid</text></g><g id="floor"><rect x="805" y="215" width="210" height="123" rx="9" class="new"/><text x="910.0" y="243" text-anchor="middle" class="t">权重下限保护</text><text x="910.0" y="268" text-anchor="middle" class="s">W = 0.05 + 0.95·r</text><text x="910.0" y="291" text-anchor="middle" class="s">输出 1×16×8</text><text x="910.0" y="314" text-anchor="middle" class="s">只需当前这张图</text></g><path d="M165 105H200" class="arrow"/><path d="M395 105H430" class="arrow"/><path d="M590 105H805" class="arrow"/><path d="M1015 105H1050" class="arrow"/><path d="M510 155V215" class="arrow dash"/><path d="M765 274H805" class="arrow"/><path d="M910 215V155" class="arrow"/><text x="27" y="245" class="s">推理不使用：</text><text x="27" y="272" class="s">身份标签 / 其他源图 / donor</text><text x="27" y="299" class="s">原型 / mask 真值 / CLIP / 姿态</text><text x="27" y="381" class="s">训练另接 512→651 分类器；CE 与 Triplet 可沿加权池化回传。detach 仅截断头输入回到骨干的支路。</text></svg>