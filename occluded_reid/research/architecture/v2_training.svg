<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1300 666" role="img" aria-label="第二阶段训练目标生成与梯度边界"><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#18243a}.t{font-size:17px;font-weight:700}.s{font-size:13px}.box{fill:#e7f0ff;stroke:#3774bb;stroke-width:1.5}.new{fill:#fff1d4;stroke:#bf8319;stroke-width:1.5}.std{fill:#e5f5ed;stroke:#5c9a75;stroke-width:1.5}.candidate{fill:#eee6ff;stroke:#7953ab;stroke-width:1.5}.arrow{stroke:#526985;stroke-width:2;fill:none;marker-end:url(#arr)}.dash{stroke-dasharray:6 4}</style><rect width="1300" height="100%" fill="white"/><defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10z" fill="#526985"/></marker></defs><g><rect x="25" y="25" width="220" height="100" rx="9" class="std"/><text x="135.0" y="53" text-anchor="middle" class="t">PK 训练批次</text><text x="135.0" y="78" text-anchor="middle" class="s">6 IDs × 4 draws</text><text x="135.0" y="101" text-anchor="middle" class="s">源图索引 u / 身份 y</text></g><g id="input_views"><rect x="280" y="25" width="270" height="100" rx="9" class="new"/><text x="415.0" y="53" text-anchor="middle" class="t">固定矩形，替换两个 donor</text><text x="415.0" y="78" text-anchor="middle" class="s">clean x / 遮挡 xa / 遮挡 xb</text><text x="415.0" y="101" text-anchor="middle" class="s">V：未被矩形覆盖的区域</text></g><g><rect x="585" y="25" width="265" height="100" rx="9" class="box"/><text x="717.5" y="53" text-anchor="middle" class="t">共享 OSNet · 一次前向</text><text x="717.5" y="78" text-anchor="middle" class="s">72×3×256×128</text><text x="717.5" y="101" text-anchor="middle" class="s">F0 / Fa / Fb：各 24×512×16×8</text></g><g><rect x="885" y="25" width="390" height="100" rx="9" class="std"/><text x="1080.0" y="53" text-anchor="middle" class="t">三视图检索与身份训练</text><text x="1080.0" y="78" text-anchor="middle" class="s">同一 FC / 分类器；CE + 0.5 Triplet</text><text x="1080.0" y="101" text-anchor="middle" class="s">Triplet 按视图分别计算后平均</text></g><path d="M245 75H280" class="arrow"/><path d="M550 75H585" class="arrow"/><path d="M850 75H885" class="arrow"/><g id="peer_prototypes"><rect x="25" y="210" width="340" height="148" rx="9" class="candidate"/><text x="195.0" y="238" text-anchor="middle" class="t">clean → 临时身份原型</text><text x="195.0" y="263" text-anchor="middle" class="s">GAP(F0) → 同身份其他源图 p</text><text x="195.0" y="286" text-anchor="middle" class="s">排除 anchor 的全部源图副本</text><text x="195.0" y="309" text-anchor="middle" class="s">重复源图按出现次数倒数加权</text><text x="195.0" y="332" text-anchor="middle" class="s">其他身份批内原型 n；无 memory bank</text></g><g id="peer_margin"><rect x="405" y="210" width="405" height="148" rx="9" class="candidate"/><text x="607.5" y="238" text-anchor="middle" class="t">两个视图的局部身份 margin</text><text x="607.5" y="263" text-anchor="middle" class="s">m_v(s) = cos(Fv(s), p)</text><text x="607.5" y="286" text-anchor="middle" class="s">− max[其他身份] cos(Fv(s), n)</text><text x="607.5" y="309" text-anchor="middle" class="s">I = sigmoid(min(m_a,m_b) / 0.1)</text><text x="607.5" y="332" text-anchor="middle" class="s">要求两种 donor 下都保留身份支持</text></g><g id="stability_target"><rect x="850" y="210" width="425" height="148" rx="9" class="new"/><text x="1062.5" y="238" text-anchor="middle" class="t">几何项 G 与旧稳定性 A</text><text x="1062.5" y="263" text-anchor="middle" class="s">G = AvgPool(V) → 1×16×8</text><text x="1062.5" y="286" text-anchor="middle" class="s">A = exp(−[1−cos(Fa,Fb)] / 0.15)</text><text x="1062.5" y="309" text-anchor="middle" class="s">stability: G·A；peer: G·I</text><text x="1062.5" y="332" text-anchor="middle" class="s">联合目标: G·I·A</text></g><path d="M700 125V165H195V210" class="arrow dash"/><path d="M720 125V180H608V210" class="arrow dash"/><path d="M740 125V165H1062V210" class="arrow dash"/><path d="M365 284H405" class="arrow"/><g id="detached_target"><rect x="405" y="440" width="405" height="122" rx="9" class="candidate"/><text x="607.5" y="468" text-anchor="middle" class="t">停止梯度的空间目标 T</text><text x="607.5" y="493" text-anchor="middle" class="s">B×1×16×8；这是软监督</text><text x="607.5" y="516" text-anchor="middle" class="s">不是人体分割或身份概率真值</text><text x="607.5" y="539" text-anchor="middle" class="s">整个原型 / margin / T 分支 no_grad</text></g><g id="calibration"><rect x="25" y="440" width="340" height="122" rx="9" class="new"/><text x="195.0" y="468" text-anchor="middle" class="t">可靠性校准 BCE</text><text x="195.0" y="493" text-anchor="middle" class="s">平均 BCE(ra,T) 和 BCE(rb,T)</text><text x="195.0" y="516" text-anchor="middle" class="s">仅对遮挡视图显式校准</text><text x="195.0" y="539" text-anchor="middle" class="s">损失权重 0.5；ra/rb 来自 v1 头</text></g><g id="evidence"><rect x="850" y="440" width="425" height="122" rx="9" class="new"/><text x="1062.5" y="468" text-anchor="middle" class="t">剩余证据一致性（可选）</text><text x="1062.5" y="493" text-anchor="middle" class="s">T 重池化 clean 教师与 Fa / Fb</text><text x="1062.5" y="516" text-anchor="middle" class="s">clean 教师 detach；cosine 对齐</text><text x="1062.5" y="539" text-anchor="middle" class="s">原样复用 v1 loss，权重 0.5</text></g><path d="M608 358V440" class="arrow"/><path d="M1062 358V400H675V440" class="arrow"/><path d="M405 500H365" class="arrow"/><path d="M810 500H850" class="arrow"/><text x="26" y="610" class="s">紫色：本阶段自行实现的监督候选；橙色：v1 沿用；蓝色：OSNet；绿色：常规训练。全部差值均需消融检验。</text><text x="26" y="638" class="s">RGANet（TIFS 2024）已有判别性 / 不变性联合评估；DPM（MM 2022）已有原型掩码。此图不构成首次创新声明。</text></svg>