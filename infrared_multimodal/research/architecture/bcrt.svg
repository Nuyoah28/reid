<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1080" viewBox="0 0 1500 1080" role="img" aria-label="02 / AGW + BCRT：仅在训练阶段增加受约束特征增强">
        <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#60758a"/></marker></defs>
        <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#18344b}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#52697b}.label{font-size:18px;font-weight:700}.line{font-size:15px}.src{font-size:13px;fill:#52697b}.wire{fill:none;stroke:#60758a;stroke-width:2;marker-end:url(#arr)}</style>
        <rect width="1500" height="1080" fill="#f7fafc"/>
        <text x="42" y="50" class="title">02 / AGW + BCRT：仅在训练阶段增加受约束特征增强</text><text x="42" y="80" class="sub">蓝色：复用的图像编码路径　橙色：本项目新增训练计算　虚线：训练损失分支；形状省略 batch 维</text>
<g data-box="42,120,235,125">
<rect x="42" y="120" width="235" height="125" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="42" y="132" width="5" height="101" rx="2" fill="#215da8"/>
<text x="58" y="149" class="label">可见光 VIS</text>
<text x="58" y="174" class="line">3 × 288 × 144</text>
<text x="58" y="198" class="line">RGB 图像；独立 stem</text>
<text x="58" y="232" class="src">训练 8 张 / 推理按模态输入</text>
</g>
<g data-box="42,280,235,125">
<rect x="42" y="280" width="235" height="125" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="42" y="292" width="5" height="101" rx="2" fill="#215da8"/>
<text x="58" y="309" class="label">红外 IR</text>
<text x="58" y="334" class="line">3 × 288 × 144</text>
<text x="58" y="358" class="line">读取后转换为 3 通道</text>
<text x="58" y="392" class="src">训练 8 张；非像素配对</text>
</g>
<g data-box="325,120,390,125">
<rect x="325" y="120" width="390" height="125" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="325" y="132" width="5" height="101" rx="2" fill="#215da8"/>
<text x="341" y="149" class="label">VIS stem：模态独立参数</text>
<text x="341" y="174" class="line">Conv 7×7, 3→64, s2, p3 → BN → ReLU</text>
<text x="341" y="198" class="line">MaxPool 3×3, s2, p1 → 64×72×36</text>
<text x="341" y="232" class="src">ResNet [S1]；双流结构 [S7]；AGW [S5]</text>
</g>
<polyline points="277,183 325,183" class="wire"/>
<g data-box="325,280,390,125">
<rect x="325" y="280" width="390" height="125" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="325" y="292" width="5" height="101" rx="2" fill="#215da8"/>
<text x="341" y="309" class="label">IR stem：模态独立参数</text>
<text x="341" y="334" class="line">Conv 7×7, 3→64, s2, p3 → BN → ReLU</text>
<text x="341" y="358" class="line">MaxPool 3×3, s2, p1 → 64×72×36</text>
<text x="341" y="392" class="src">ResNet [S1]；双流结构 [S7]；AGW [S5]</text>
</g>
<polyline points="277,343 325,343" class="wire"/>
<g data-box="785,202,660,120">
<rect x="785" y="202" width="660" height="120" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="785" y="214" width="5" height="96" rx="2" fill="#215da8"/>
<text x="801" y="231" class="label">按 batch 拼接 → 后续所有层共享参数</text>
<text x="801" y="256" class="line">训练：8 VIS + 8 IR；按相同身份采样 P=4, K=2/模态</text>
<text x="801" y="280" class="line">没有 VIS/IR 图像通道拼接；推理只编码当前输入模态</text>
<text x="801" y="309" class="src">双流共享骨干是 AGW 基线的一部分 [S5,S7]</text>
</g>
<polyline points="715,182 750,182 750,245 785,245" class="wire"/>
<polyline points="715,342 750,342 750,280 785,280" class="wire"/>
<g data-box="42,455,328,143">
<rect x="42" y="455" width="328" height="143" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="42" y="467" width="5" height="119" rx="2" fill="#215da8"/>
<text x="58" y="484" class="label">Stage 1 · 3 blocks</text>
<text x="58" y="509" class="line">64 → 256 × 72 × 36</text>
<text x="58" y="533" class="line">B1 投影捷径；B2–B3 恒等捷径</text>
<text x="58" y="557" class="line">无 Non-local</text>
<text x="58" y="585" class="src">ResNet-50 [S1]；Non-local [S2,S5]</text>
</g>
<polyline points="370,523 400,523" class="wire"/>
<g data-box="400,455,328,143">
<rect x="400" y="455" width="328" height="143" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="400" y="467" width="5" height="119" rx="2" fill="#215da8"/>
<text x="416" y="484" class="label">Stage 2 · 4 blocks</text>
<text x="416" y="509" class="line">256 → 512 × 36 × 18</text>
<text x="416" y="533" class="line">B1 的 Conv3×3 stride=2</text>
<text x="416" y="557" class="line">B3、B4 后各一个 Non-local</text>
<text x="416" y="585" class="src">ResNet-50 [S1]；Non-local [S2,S5]</text>
</g>
<polyline points="728,523 758,523" class="wire"/>
<g data-box="758,455,328,143">
<rect x="758" y="455" width="328" height="143" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="758" y="467" width="5" height="119" rx="2" fill="#215da8"/>
<text x="774" y="484" class="label">Stage 3 · 6 blocks</text>
<text x="774" y="509" class="line">512 → 1024 × 18 × 9</text>
<text x="774" y="533" class="line">B1 的 Conv3×3 stride=2</text>
<text x="774" y="557" class="line">B4、B5、B6 后各一个 Non-local</text>
<text x="774" y="585" class="src">ResNet-50 [S1]；Non-local [S2,S5]</text>
</g>
<polyline points="1086,523 1116,523" class="wire"/>
<g data-box="1116,455,328,143">
<rect x="1116" y="455" width="328" height="143" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="1116" y="467" width="5" height="119" rx="2" fill="#215da8"/>
<text x="1132" y="484" class="label">Stage 4 · 3 blocks</text>
<text x="1132" y="509" class="line">1024 → 2048 × 18 × 9</text>
<text x="1132" y="533" class="line">B1 stride=1；保留较高分辨率</text>
<text x="1132" y="557" class="line">无 Non-local</text>
<text x="1132" y="585" class="src">ResNet-50 [S1]；Non-local [S2,S5]</text>
</g>
<polyline points="1115,322 1115,425 205,425 205,455" class="wire"/>
<g data-box="42,652,390,126">
<rect x="42" y="652" width="390" height="126" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="42" y="664" width="5" height="102" rx="2" fill="#215da8"/>
<text x="58" y="681" class="label">GeM 全局池化 → f ∈ R²⁰⁴⁸</text>
<text x="58" y="706" class="line">max(x,0)³ → 空间均值 → 立方根</text>
<text x="58" y="730" class="line">固定 p=3；FP32 计算避免 AMP 溢出</text>
<text x="58" y="765" class="src">GeM [S3]；AGW 固定幂实现 [S5]</text>
</g>
<polyline points="1280,598 1280,624 237,624 237,652" class="wire"/>
<g data-box="500,652,390,126">
<rect x="500" y="652" width="390" height="126" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="500" y="664" width="5" height="102" rx="2" fill="#215da8"/>
<text x="516" y="681" class="label">BNNeck → h ∈ R²⁰⁴⁸</text>
<text x="516" y="706" class="line">BatchNorm1d(2048)，bias 冻结</text>
<text x="516" y="730" class="line">推理：L2(h) → 2048 维检索向量</text>
<text x="516" y="765" class="src">BNNeck [S4]；AGW [S5]</text>
</g>
<polyline points="432,711 500,711" class="wire"/>
<g data-box="958,652,487,126">
<rect x="958" y="652" width="487" height="126" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="958" y="664" width="5" height="102" rx="2" fill="#215da8"/>
<text x="974" y="681" class="label">训练：ID 分类 + 加权正则 Triplet</text>
<text x="974" y="706" class="line">Linear 2048→N_id，无 bias → CE</text>
<text x="974" y="730" class="line">WRT 使用池化特征 f；推理为余弦相似度</text>
<text x="974" y="765" class="src">CE：通用目标；WRT / AGW [S5]</text>
</g>
<polyline points="890,690 958,690" class="wire" stroke-dasharray="7 5"/>
<polyline points="432,752 466,752 466,797 1200,797 1200,778" class="wire" stroke-dasharray="7 5"/>
<g data-box="42,857,390,140">
<rect x="42" y="857" width="390" height="140" rx="12" fill="white" stroke="#bf5b19" stroke-width="1.7"/><rect x="42" y="869" width="5" height="116" rx="2" fill="#bf5b19"/>
<text x="58" y="886" class="label">新增：跨身份残差供体</text>
<text x="58" y="911" class="line">z=L2(f)；每身份 VIS / IR 均值</text>
<text x="58" y="935" class="line">δ_j = cᵀ_j − cⱽ_j；供体 j ≠ y</text>
<text x="58" y="959" class="line">δ 和原型停止梯度</text>
<text x="58" y="984" class="src">本项目组合设计 BCRT [S6]，训练专用</text>
</g>
<g data-box="500,857,390,140">
<rect x="500" y="857" width="390" height="140" rx="12" fill="white" stroke="#bf5b19" stroke-width="1.7"/><rect x="500" y="869" width="5" height="116" rx="2" fill="#bf5b19"/>
<text x="516" y="886" class="label">新增：解析计算可行步长</text>
<text x="516" y="911" class="line">针对当前 batch 中每个异身份原型</text>
<text x="516" y="935" class="line">保留至少 ρ=0.5 的初始欧式间隔</text>
<text x="516" y="959" class="line">t=min(α=0.5, 所有有效边界上限)</text>
<text x="516" y="984" class="src">本项目推导与实现 [S6]，非泛化证明</text>
</g>
<g data-box="958,857,487,140">
<rect x="958" y="857" width="487" height="140" rx="12" fill="white" stroke="#bf5b19" stroke-width="1.7"/><rect x="958" y="869" width="5" height="116" rx="2" fill="#bf5b19"/>
<text x="974" y="886" class="label">新增：虚拟特征的原型监督</text>
<text x="974" y="911" class="line">v=L2(z+t·d) → 原型余弦 logits</text>
<text x="974" y="935" class="line">温度 T=0.1 → CE_virtual</text>
<text x="974" y="959" class="line">总损失 CE + WRT + 0.2 CE_virtual</text>
<text x="974" y="984" class="src">前 5 epoch 辅助权重为 0；无新增推理参数</text>
</g>
<polyline points="235,778 235,857" class="wire" stroke-dasharray="7 5"/>
<polyline points="432,921 500,921" class="wire" stroke-dasharray="7 5"/>
<polyline points="890,921 958,921" class="wire" stroke-dasharray="7 5"/>
<text x="42" y="1033" class="sub">BCRT 是待验证的研究候选；“残差生成/原型监督”已有前人研究，创新主张限定为跨身份供体与身份间隔约束的结合。</text><text x="42" y="1060" class="src">实现依据：code/model.py · code/objectives.py · 实测尺寸见 layer_trace.json ｜ 2026-11-13</text></svg>