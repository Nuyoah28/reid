<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1070" viewBox="0 0 1500 1070" role="img" aria-label="05 / BCRT：供体残差 → 身份间隔 → 安全步长 → 训练监督">
        <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#60758a"/></marker></defs>
        <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#18344b}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#52697b}.label{font-size:18px;font-weight:700}.line{font-size:15px}.src{font-size:13px;fill:#52697b}.wire{fill:none;stroke:#60758a;stroke-width:2;marker-end:url(#arr)}</style>
        <rect width="1500" height="1070" fill="#f7fafc"/>
        <text x="42" y="50" class="title">05 / BCRT：供体残差 → 身份间隔 → 安全步长 → 训练监督</text><text x="42" y="80" class="sub">本项目候选机制（2026）；固定 prototype 的欧式几何有解析约束，后续归一化余弦 CE 和泛化没有该保证。</text>
<g data-box="42,125,425,160">
<rect x="42" y="125" width="425" height="160" rx="12" fill="white" stroke="#167d79" stroke-width="1.7"/><rect x="42" y="137" width="5" height="136" rx="2" fill="#167d79"/>
<text x="58" y="154" class="label">① 采样与特征归一化</text>
<text x="58" y="179" class="line">4 个身份 × 每模态 2 张 = 16 张</text>
<text x="58" y="203" class="line">共享图像编码只执行一次</text>
<text x="58" y="227" class="line">z_i=L2(f_i)；无额外图像前向</text>
<text x="58" y="272" class="src">输入来自 baseline 的 GeM 输出</text>
</g>
<g data-box="538,125,425,160">
<rect x="538" y="125" width="425" height="160" rx="12" fill="white" stroke="#bf5b19" stroke-width="1.7"/><rect x="538" y="137" width="5" height="136" rx="2" fill="#bf5b19"/>
<text x="554" y="154" class="label">② 估计模态中心与原型</text>
<text x="554" y="179" class="line">cⱽ_j=mean(z of VIS identity j)</text>
<text x="554" y="203" class="line">cᵀ_j=mean(z of IR identity j)</text>
<text x="554" y="227" class="line">p_j=stopgrad((cⱽ_j+cᵀ_j)/2)</text>
<text x="554" y="272" class="src">batch 局部原型；不跨 batch 存储</text>
</g>
<g data-box="1030,125,420,160">
<rect x="1030" y="125" width="420" height="160" rx="12" fill="white" stroke="#bf5b19" stroke-width="1.7"/><rect x="1030" y="137" width="5" height="136" rx="2" fill="#bf5b19"/>
<text x="1046" y="154" class="label">③ 选择所有其他身份供体</text>
<text x="1046" y="179" class="line">δ_j=stopgrad(cᵀ_j−cⱽ_j), j≠y_i</text>
<text x="1046" y="203" class="line">VIS 锚点：d=+δ_j；IR 锚点：d=−δ_j</text>
<text x="1046" y="227" class="line">16 × (4−1) = 48 个候选虚拟对</text>
<text x="1046" y="272" class="src">排除同一身份以减少标签专属残差捷径</text>
</g>
<polyline points="467,205 538,205" class="wire"/>
<polyline points="963,205 1030,205" class="wire"/>
<g data-box="42,365,675,178">
<rect x="42" y="365" width="675" height="178" rx="12" fill="white" stroke="#bf5b19" stroke-width="1.7"/><rect x="42" y="377" width="5" height="154" rx="2" fill="#bf5b19"/>
<text x="58" y="394" class="label">④ 对每个异身份 k 计算欧式间隔</text>
<text x="58" y="419" class="line">g_k(0) = ||z−p_k||² − ||z−p_y||²</text>
<text x="58" y="443" class="line">a_k = 2 d · (p_y−p_k)</text>
<text x="58" y="467" class="line">g_k(t) = g_k(0) + t a_k</text>
<text x="58" y="491" class="line">任一初始间隔 ≤ 1e−6：该锚点不参与辅助损失</text>
<text x="58" y="530" class="src">原型 / 方向 / 步长停止梯度；当前 z 保留梯度</text>
</g>
<g data-box="785,365,665,178">
<rect x="785" y="365" width="665" height="178" rx="12" fill="white" stroke="#bf5b19" stroke-width="1.7"/><rect x="785" y="377" width="5" height="154" rx="2" fill="#bf5b19"/>
<text x="801" y="394" class="label">⑤ 解析求可行上限，不增加可学习参数</text>
<text x="801" y="419" class="line">要求 g_k(t) ≥ ρ g_k(0)，ρ=0.5</text>
<text x="801" y="443" class="line">仅 a_k &lt; −1e−8 时产生上界：</text>
<text x="801" y="467" class="line">u_k = (1−ρ) g_k(0) / (−a_k)</text>
<text x="801" y="491" class="line">t = clip(min_k u_k, 0, α=0.5)；无上界时 t=α</text>
<text x="801" y="530" class="src">约束对象是未归一化的 z+t·d 与固定原型</text>
</g>
<polyline points="1240,285 1240,325 375,325 375,365" class="wire"/>
<polyline points="717,450 785,450" class="wire"/>
<g data-box="42,620,675,153">
<rect x="42" y="620" width="675" height="153" rx="12" fill="white" stroke="#bf5b19" stroke-width="1.7"/><rect x="42" y="632" width="5" height="129" rx="2" fill="#bf5b19"/>
<text x="58" y="649" class="label">⑥ 虚拟特征监督</text>
<text x="58" y="674" class="line">v=L2(z+t·d)</text>
<text x="58" y="698" class="line">logits=v · L2(p)ᵀ / T，T=0.1</text>
<text x="58" y="722" class="line">L_virtual=mean(CE(logits,y))，只计 eligible 对</text>
<text x="58" y="760" class="src">反向传播到当前锚点及编码网络；供体与原型为常量目标</text>
</g>
<g data-box="785,620,665,153">
<rect x="785" y="620" width="665" height="153" rx="12" fill="white" stroke="#167d79" stroke-width="1.7"/><rect x="785" y="632" width="5" height="129" rx="2" fill="#167d79"/>
<text x="801" y="649" class="label">⑦ 总损失与推理</text>
<text x="801" y="674" class="line">L = L_CE + L_WRT + λ L_virtual</text>
<text x="801" y="698" class="line">λ=0（前 5 epoch），之后 λ=0.2</text>
<text x="801" y="722" class="line">推理丢弃整个 BCRT 计算；仍为 L2(BNNeck(f))</text>
<text x="801" y="760" class="src">改进只发生在训练目标中；额外推理参数数目=0</text>
</g>
<polyline points="1110,543 1110,580 375,580 375,620" class="wire"/>
<polyline points="717,694 785,694" class="wire"/>
<g data-box="42,850,1408,147">
<rect x="42" y="850" width="1408" height="147" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="42" y="862" width="5" height="123" rx="2" fill="#215da8"/>
<text x="58" y="879" class="label">四组消融各自回答什么问题</text>
<text x="58" y="904" class="line">AGW：原基线 CE+WRT。Center：加普通跨模态中心 L2，检验简单对齐是否已足够。</text>
<text x="58" y="928" class="line">Unbounded：相同供体 / eligible 掩码 / 虚拟 CE，但 t 恒为 α。BCRT：仅将 t 改为解析受约束步长。</text>
<text x="58" y="952" class="line">报告 capped_fraction、eligible_fraction、间隔违反数及 Rank-1 / mAP；若约束几乎不触发或精度不升，必须如实报告。</text>
<text x="58" y="984" class="src">特征生成与原型学习不是本项目首创：相关工作 PDM / ICASSP 2025；这里未复制其模块或代码</text>
</g><text x="42" y="1050" class="src">实现依据：code/model.py · code/objectives.py · 实测尺寸见 layer_trace.json ｜ 2026-11-13</text></svg>