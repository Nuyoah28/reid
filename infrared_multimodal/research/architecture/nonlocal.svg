<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="850" viewBox="0 0 1500 850" role="img" aria-label="04 / Non-local：保留官方 AGW 的窄通道实现">
        <defs><marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10" fill="#60758a"/></marker></defs>
        <style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#18344b}.title{font-size:28px;font-weight:700}.sub{font-size:16px;fill:#52697b}.label{font-size:18px;font-weight:700}.line{font-size:15px}.src{font-size:13px;fill:#52697b}.wire{fill:none;stroke:#60758a;stroke-width:2;marker-end:url(#arr)}</style>
        <rect width="1500" height="850" fill="#f7fafc"/>
        <text x="42" y="50" class="title">04 / Non-local：保留官方 AGW 的窄通道实现</text><text x="42" y="80" class="sub">来源：Wang et al., Non-local Neural Networks, CVPR 2018；实际公式与通道数按 AGW commit e817a267。</text>
<g data-box="42,170,215,120">
<rect x="42" y="170" width="215" height="120" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="42" y="182" width="5" height="96" rx="2" fill="#215da8"/>
<text x="58" y="199" class="label">输入 X</text>
<text x="58" y="224" class="line">B × C × H × W</text>
<text x="58" y="248" class="line">N = H·W</text>
<text x="58" y="277" class="src">C=512 或 1024 [S2,S5]</text>
</g>
<g data-box="335,120,290,120">
<rect x="335" y="120" width="290" height="120" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="335" y="132" width="5" height="96" rx="2" fill="#215da8"/>
<text x="351" y="149" class="label">θ: Conv 1×1, C→1</text>
<text x="351" y="174" class="line">stride=1, bias=True</text>
<text x="351" y="198" class="line">展平 / 转置 → B × N × 1</text>
<text x="351" y="227" class="src">AGW 代码中 inter_channels=1</text>
</g>
<polyline points="257,225 290,225 290,180 335,180" class="wire"/>
<g data-box="335,285,290,120">
<rect x="335" y="285" width="290" height="120" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="335" y="297" width="5" height="96" rx="2" fill="#215da8"/>
<text x="351" y="314" class="label">φ: Conv 1×1, C→1</text>
<text x="351" y="339" class="line">stride=1, bias=True</text>
<text x="351" y="363" class="line">展平 / 转置 → B × 1 × N</text>
<text x="351" y="392" class="src">AGW 代码中 inter_channels=1</text>
</g>
<polyline points="257,225 290,225 290,345 335,345" class="wire"/>
<g data-box="335,450,290,120">
<rect x="335" y="450" width="290" height="120" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="335" y="462" width="5" height="96" rx="2" fill="#215da8"/>
<text x="351" y="479" class="label">g: Conv 1×1, C→1</text>
<text x="351" y="504" class="line">stride=1, bias=True</text>
<text x="351" y="528" class="line">展平 / 转置 → B × N × 1</text>
<text x="351" y="557" class="src">AGW 代码中 inter_channels=1</text>
</g>
<polyline points="257,225 290,225 290,510 335,510" class="wire"/>
<g data-box="720,193,350,130">
<rect x="720" y="193" width="350" height="130" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="720" y="205" width="5" height="106" rx="2" fill="#215da8"/>
<text x="736" y="222" class="label">A = (θ(X) @ φ(X)) / N</text>
<text x="736" y="247" class="line">形状 B × N × N</text>
<text x="736" y="271" class="line">点积后除以位置数 N；没有 softmax</text>
<text x="736" y="310" class="src">S2: N=648；S3: N=162</text>
</g>
<polyline points="625,180 670,180 670,230 720,230" class="wire"/>
<polyline points="625,345 670,345 670,285 720,285" class="wire"/>
<g data-box="1140,380,310,140">
<rect x="1140" y="380" width="310" height="140" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="1140" y="392" width="5" height="116" rx="2" fill="#215da8"/>
<text x="1156" y="409" class="label">A @ g(X) → reshape</text>
<text x="1156" y="434" class="line">B × N × 1</text>
<text x="1156" y="458" class="line">重排成 B × 1 × H × W</text>
<text x="1156" y="507" class="src">聚合全图上下文</text>
</g>
<polyline points="1070,260 1290,260 1290,380" class="wire"/>
<polyline points="625,510 1010,510 1010,450 1140,450" class="wire"/>
<g data-box="720,630,370,125">
<rect x="720" y="630" width="370" height="125" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="720" y="642" width="5" height="101" rx="2" fill="#215da8"/>
<text x="736" y="659" class="label">输出投影：Conv 1×1, 1→C</text>
<text x="736" y="684" class="line">bias=True → BN2d(C)</text>
<text x="736" y="708" class="line">BN 的 γ、β 均以 0 初始化</text>
<text x="736" y="742" class="src">因此初始时残差支路为 0</text>
</g>
<g data-box="310,630,340,125">
<rect x="310" y="630" width="340" height="125" rx="12" fill="white" stroke="#215da8" stroke-width="1.7"/><rect x="310" y="642" width="5" height="101" rx="2" fill="#215da8"/>
<text x="326" y="659" class="label">Add：X + projected context</text>
<text x="326" y="684" class="line">输出 B × C × H × W</text>
<text x="326" y="708" class="line">没有额外 ReLU 或空间采样</text>
<text x="326" y="742" class="src">位置：S2B3/B4；S3B4/B5/B6</text>
</g>
<polyline points="1290,520 1290,690 1090,690" class="wire"/>
<polyline points="720,690 650,690" class="wire"/>
<polyline points="150,290 150,690 310,690" class="wire"/>
<text x="42" y="802" class="sub">注意：此处的 1 通道不是通行的 C/2 配置；为了可核对地复用 AGW，本项目保留上游行为并提供数值等价测试。</text><text x="42" y="830" class="src">实现依据：code/model.py · code/objectives.py · 实测尺寸见 layer_trace.json ｜ 2026-11-13</text></svg>